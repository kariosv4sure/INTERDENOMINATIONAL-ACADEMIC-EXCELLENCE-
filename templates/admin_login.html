{% extends "base.html" %}

{% block title %}Admin Login | I.A.E™{% endblock %}

{% block content %}
<section class="admin-login-section">
    <div class="container">
        <div class="admin-login-container">
            <div class="admin-badge">
                <div class="admin-lock-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>Admin Access</h2>
                <p>Enter your credentials to access the admin dashboard</p>
            </div>

            <form method="POST" action="{{ url_for('admin_login') }}" class="auth-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" required placeholder="Enter admin username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Enter admin password" autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary admin-login-btn">
                    <i class="fas fa-lock-open"></i> Access Dashboard
                </button>
            </form>

            <div class="back-link">
                <a href="{{ url_for('index') }}">
                    <i class="fas fa-arrow-left"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>
</section>

<script>
function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.querySelector('.toggle-password i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
